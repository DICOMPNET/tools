<h1 data-i18n="guide.html-entity-encoder.title" data-i18n-fb="HTML 實體編碼與 XSS 轉義">HTML 實體編碼與 XSS 轉義</h1>
<p class="lead" data-i18n="guide.html-entity-encoder.intro" data-i18n-fb="為什麼要把 &lt; &gt; &amp; 轉成實體，如何用 ToolBox 做 HTML 實體編解碼與基礎 XSS 防護。">為什麼要把 < > & 轉成實體，如何用 ToolBox 做 HTML 實體編解碼與基礎 XSS 防護。</p>
<div class="toc"><strong>目錄</strong><ul><li><a href="#s0" data-i18n="guide.html-entity-encoder.sec0" data-i18n-fb="為什麼需要實體編碼">為什麼需要實體編碼</a></li><li><a href="#s1" data-i18n="guide.html-entity-encoder.sec1" data-i18n-fb="實體 vs 字元引用">實體 vs 字元引用</a></li><li><a href="#s2" data-i18n="guide.html-entity-encoder.sec2" data-i18n-fb="在 ToolBox 中使用">在 ToolBox 中使用</a></li><li><a href="#s3" data-i18n="guide.html-entity-encoder.sec3" data-i18n-fb="XSS 防護的邊界">XSS 防護的邊界</a></li></ul></div>
<h2 id="s0" data-i18n="guide.html-entity-encoder.sec0" data-i18n-fb="為什麼需要實體編碼">為什麼需要實體編碼</h2>
<p data-i18n="guide.html-entity-encoder.p0.0" data-i18n-fb="在 HTML 中直接輸出  會被瀏覽器當作標籤/指令碼執行，造成 XSS。把  轉成 &amp;lt;、&gt; 轉成 &amp;gt;、&amp; 轉成 &amp;amp;，可讓特殊字元「只顯示不執行」。">在 HTML 中直接輸出 <code><script></code> 會被瀏覽器當作標籤/指令碼執行，造成 XSS。把 <code><</code> 轉成 <code>&lt;</code>、<code>></code> 轉成 <code>&gt;</code>、<code>&</code> 轉成 <code>&amp;</code>，可讓特殊字元「只顯示不執行」。</p>
<h2 id="s1" data-i18n="guide.html-entity-encoder.sec1" data-i18n-fb="實體 vs 字元引用">實體 vs 字元引用</h2>
<p data-i18n="guide.html-entity-encoder.p1.0" data-i18n-fb="&amp;lt; 是命名實體，&amp;#60; 是十進位制數字引用，&amp;#x3C; 是十六進位制；三者等價，命名實體更易讀。"><code>&lt;</code> 是命名實體，<code>&#60;</code> 是十進位制數字引用，<code>&#x3C;</code> 是十六進位制；三者等價，命名實體更易讀。</p>
<h2 id="s2" data-i18n="guide.html-entity-encoder.sec2" data-i18n-fb="在 ToolBox 中使用">在 ToolBox 中使用</h2>
<p data-i18n="guide.html-entity-encoder.p2.0" data-i18n-fb="貼上文本點選編碼即可獲得實體化結果，適合回填到模板/富文本前做轉義；解碼則把實體還原為原字元。">貼上文本點選編碼即可獲得實體化結果，適合回填到模板/富文本前做轉義；解碼則把實體還原為原字元。</p>
<h2 id="s3" data-i18n="guide.html-entity-encoder.sec3" data-i18n-fb="XSS 防護的邊界">XSS 防護的邊界</h2>
<p data-i18n="guide.html-entity-encoder.p3.0" data-i18n-fb="實體編碼只是輸出層手段之一，不能替代引數化查詢、CSP、輸入校驗等綜合防護；對 URL、屬性、JS 上下文要分別處理。">實體編碼只是輸出層手段之一，不能替代引數化查詢、CSP、輸入校驗等綜合防護；對 URL、屬性、JS 上下文要分別處理。</p>

<a class="tool-chip" href="/zh-tw/tools/it/base64-converter.html">Base64 編解碼</a><p class="back"></p></div><div class="faq"><h2 data-i18n="guide.html-entity-encoder.sec4" data-i18n-fb="常見問題">常見問題</h2><dl><dt data-i18n="guide.html-entity-encoder.faqs.0.q" data-i18n-fb="屬性值裡也要轉義引號嗎？">屬性值裡也要轉義引號嗎？</dt><dd data-i18n="guide.html-entity-encoder.faqs.0.a" data-i18n-fb="要。放在雙引號屬性中的 &quot; 應轉成 &amp;quot;，單引號屬性同理轉 &amp;apos;，避擴音前閉合屬性。">要。放在雙引號屬性中的 " 應轉成 &quot;，單引號屬性同理轉 &apos;，避擴音前閉合屬性。</dd>
<dt data-i18n="guide.html-entity-encoder.faqs.0.q" data-i18n-fb="轉義後還能正常顯示嗎？">轉義後還能正常顯示嗎？</dt><dd data-i18n="guide.html-entity-encoder.faqs.1.a" data-i18n-fb="能。瀏覽器渲染時會把實體還原為對應字元顯示，僅原始碼層面是轉義形態。">能。瀏覽器渲染時會把實體還原為對應字元顯示，僅原始碼層面是轉義形態。</dd>
<dt data-i18n="guide.html-entity-encoder.faqs.0.q" data-i18n-fb="僅做 HTML 轉義夠防 XSS 嗎？">僅做 HTML 轉義夠防 XSS 嗎？</dt><dd data-i18n="guide.html-entity-encoder.faqs.2.a" data-i18n-fb="對 HTML 正文足夠；但若內容進入 URL、on* 事件或 JS 字串，需要對應場景的編碼，單一手段並不萬能。">對 HTML 正文足夠；但若內容進入 URL、on* 事件或 JS 字串，需要對應場景的編碼，單一手段並不萬能。</dd></dl></div>
